name: Deploy

on:
    workflow_dispatch:
        inputs:
            environment:
                description: Deployment target
                required: true
                type: choice
                options:
                    - preview
                    - production

jobs:
    style:
        name: Style
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24.x'
                  cache: 'npm'
                  cache-dependency-path: package-lock.json
            - name: Install
              run: npm ci
            - name: Prettier check
              run: npm run style

    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24.x'
                  cache: 'npm'
                  cache-dependency-path: package-lock.json
            - name: Install
              run: npm ci
            - name: Typecheck
              run: npm run typecheck

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24.x'
                  cache: 'npm'
                  cache-dependency-path: package-lock.json
            - name: Install
              run: npm ci
            - name: ESLint
              run: npm run lint

    # ── Deploy ─────────────────────────────────────────────────────────────────

    deploy:
        name: Deploy to Vercel
        needs:
            - style
            - typecheck
            - lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Deploy to Vercel
              run: |
                  npx vercel pull --yes --environment=${{ inputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}
                  npx vercel build ${{ inputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
                  npx vercel deploy --prebuilt ${{ inputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
              env:
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
